name: Netzwerk zum amtlichen Sitzungsdienst prüfen
on:
  push:
    branches:
      - pruefung/sitzungsplan-20261107
permissions:
  contents: read
jobs:
  netzwerk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reguläre Diagnosewerkzeuge bereitstellen
        run: sudo apt-get update && sudo apt-get install -y curl dnsutils iproute2 poppler-utils
      - name: Unveränderte Aktualisierer-Tests
        run: python3 -m unittest maintenance/test_sitzungsplan.py
      - name: DNS, Routen, IPv4, IPv6 und amtliche Downloadwege prüfen
        run: python3 -u netzwerkpruefung/diagnose.py
      - name: Diagnose sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitzungsdienst-netzwerkdiagnose
          path: netzwerkergebnis/
          retention-days: 7
