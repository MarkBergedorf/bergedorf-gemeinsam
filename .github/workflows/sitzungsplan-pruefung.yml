name: Amtlichen IPv4-Verbindungsaufbau länger prüfen
on:
  push:
    branches: [pruefung/sitzungsplan-20261107]
permissions:
  contents: read
jobs:
  ipv4:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: IPv4 einmal mit 60 Sekunden Verbindungslimit prüfen
        run: python3 -u netzwerkpruefung/ipv4-langtest.py
      - name: Ergebnis sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitzungsdienst-ipv4-langtest
          path: netzwerkergebnis/
          retention-days: 7
